      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#kcasGrad)"/>
  <!-- College Emblem Border -->
